spring.application.name=pei
server.port=8080

# ==========================================================
# BANCO PADRÃO: H2 em arquivo local (./data/peidb.mv.db)
# Execução imediata, sem nenhuma configuração externa.
# Console: http://localhost:8080/h2-console  (JDBC URL abaixo, user "sa", sem senha)
# ==========================================================
spring.datasource.url=jdbc:h2:file:./data/peidb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================================
# JPA / Hibernate
# ==========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Thymeleaf (desative cache em desenvolvimento)
spring.thymeleaf.cache=false

# Banco inicia zerado por padrão (usuários adicionam manualmente)
pei.seed.enabled=false

