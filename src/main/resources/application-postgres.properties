# Profile PostgreSQL / Supabase — ative com: -Dspring-boot.run.profiles=postgres
# Para Supabase Transaction Pooler (porta 6543), mantenha ?prepareThreshold=0&sslmode=require na URL:
# Exemplo: jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:6543/postgres?prepareThreshold=0&sslmode=require
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pei}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=5
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update
