# Profile MySQL — ative com: -Dspring-boot.run.profiles=mysql
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pei?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Sao_Paulo}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update

